<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=1280,initial-scale=1">
<title>Introduction</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:hsl(43,23%,93%);--fg:hsl(0,0%,7%);--accent:#ea580c;--muted:hsl(0,0%,40%);
 --muted-bg:hsl(40,10%,85%);--card:hsl(43,20%,90%);--green:#16a34a;--warn:#b91c1c;
 --font:'JetBrains Mono',ui-monospace,monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
 background-image:radial-gradient(circle,var(--fg) 1px,transparent 1px);background-size:26px 26px;opacity:.05}
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:200;transition:width .3s}
.deck{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:40px 60px 44px;background:var(--bg);z-index:1}
.slide.active{display:flex}
.slide.sdark{background:hsl(0,0%,6%);color:hsl(43,23%,93%)}
.slide.anim{padding:0}
.slide.anim.active{display:block}
.canim{position:absolute;inset:0;width:100%;height:100%}
.canim .asvg{display:block;width:100%;height:100%}
.smeta{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-shrink:0}
.sdiv{flex:1;height:1px;background:var(--fg);opacity:.16}
.slide.sdark .sdiv{background:hsl(43,23%,90%);opacity:.15}
.dot8{width:9px;height:9px;background:var(--accent);flex-shrink:0}
.lbl{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stitle{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.12;letter-spacing:-.5px;max-width:1050px;margin-bottom:26px;flex-shrink:0}
.stitle .o{color:var(--accent)}
.cbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;min-height:0}
.lead{font-size:clamp(15px,1.5vw,21px);color:var(--muted);line-height:1.55;max-width:900px}
.lead.hl{border-left:5px solid var(--accent);padding-left:18px;color:var(--fg)}
.slide.sdark .lead{color:hsl(43,20%,72%)}
.flow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip{border:2px solid var(--fg);padding:12px 18px;font-size:16px;font-weight:700;background:var(--card)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip b{color:var(--accent)}
.chip.on b,.chip.warn b{color:inherit}
.arw{font-size:24px;color:var(--accent);font-weight:800}
.stat-row{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:4px}
.big{font-size:clamp(38px,5vw,68px);font-weight:800;line-height:1}
.big.on{color:var(--accent)}
.big.warn{color:var(--warn)}
.cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eq{font-size:40px;font-weight:800;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cell-part{border:2px solid var(--fg);padding:18px 20px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.cell-part b{font-size:18px;color:var(--accent);letter-spacing:.02em}
.cell-part span{font-size:14px;color:var(--muted);line-height:1.45}
.cell-part i{color:var(--warn);font-style:normal;font-weight:700}
.cell-part.hot{border-color:var(--accent);border-width:3px}
.callout{border:2px solid var(--accent);color:var(--accent);padding:14px 20px;font-size:17px;font-weight:600;align-self:flex-start}
.callout b{font-weight:800}
.stack{display:flex;flex-direction:column;gap:14px}
.wire{border-left:5px solid var(--accent);padding:6px 0 6px 18px;display:flex;flex-direction:column;gap:3px}
.wire b{font-size:19px;letter-spacing:.02em}
.wire span{font-size:14px;color:var(--muted)}
.wire.on b{color:var(--accent)}
.balance{display:flex;align-items:center;gap:20px}
.pan{border:2px solid var(--fg);padding:18px 26px;display:flex;flex-direction:column;gap:4px;background:var(--card);flex:1}
.pan b{font-size:19px}.pan span{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pan.surv{border-color:var(--green)}.pan.surv b{color:var(--green)}
.pan.die{border-color:var(--warn)}.pan.die b{color:var(--warn)}
.fulcrum{font-size:38px;color:var(--accent);font-weight:800}
.thesis{font-size:clamp(20px,2.4vw,32px);font-weight:700;line-height:1.35;max-width:960px;border-left:6px solid var(--accent);padding-left:24px}
.thesis b{color:var(--accent)}
.close{display:flex;flex-direction:column;gap:30px;align-items:center;text-align:center;justify-content:center;flex:1}
.close-tags{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:14px;font-weight:800;letter-spacing:.12em;color:var(--green)}
.close-tags span:nth-child(even){color:hsl(0,0%,35%)}
.sig{font-size:14px;color:hsl(0,0%,45%);letter-spacing:.06em}
.ccap{display:none}
.slide.sdark .ccap{border-top-color:hsl(43,23%,25%)}
.ccap-tag{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--accent);padding-top:4px;flex-shrink:0}
.ccap p{font-family:Georgia,'Times New Roman',serif;font-size:clamp(15px,1.6vw,22px);line-height:1.5;color:var(--fg);max-width:1080px}
.slide.sdark .ccap p{color:hsl(43,23%,90%)}
#controls{position:fixed;top:16px;right:20px;display:flex;gap:8px;z-index:300}
.ctrl{width:38px;height:38px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#dots{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:100;flex-wrap:wrap;max-width:80vw;justify-content:center}
.ndot{width:7px;height:7px;background:var(--muted);opacity:.4;cursor:pointer}
.ndot.active{background:var(--accent);opacity:1;width:20px}
#scount{position:fixed;bottom:16px;right:22px;font-size:12px;color:var(--muted);z-index:100;letter-spacing:.1em}
.sfoot{position:fixed;bottom:16px;left:24px;font-size:11px;color:var(--muted);letter-spacing:.1em;z-index:100;text-transform:uppercase}
/* idea_highlight.css — IDEA-KARAOKE for "PowerPoint" lecture slides.
   Append to build_deck_anim.py's CSS. Applies ONLY to slides that carry class `ih`
   (idea slides: static, i.e. NOT in anim.json, and holding >=1 idea-block).
   Model (locked with Bear): every idea rests at ACCENT ORANGE; the single active
   block flips to solid INK/BLACK and back to orange when the focus moves on.
   Pure color flip — no underlines, lifts, or border changes competing for the eye.
   The five visualization slides (anim.json) are untouched. Titles are untouched. */

.ih .idea, .ih .idea *{transition:color .3s ease}

/* RESTING — primary idea text uniform orange (override any baked warn/on colors) */
.ih .stat .big{color:var(--accent)!important}
.ih .stat .cap{color:var(--muted)!important}
.ih .wire b{color:var(--accent)!important}
.ih .wire span{color:var(--muted)!important}
.ih .flow .chip{color:var(--accent)!important;background:var(--card)!important;border-color:var(--accent)!important}
.ih .cell-part b{color:var(--accent)!important}
.ih .cell-part span{color:var(--muted)!important}
.ih .pan b{color:var(--accent)!important}
.ih .pan span{color:var(--muted)!important}
.ih .lead{color:var(--muted)!important}
.ih .thesis b, .ih .callout{color:var(--accent)!important;background:none!important;padding:0}

/* ACTIVE — the one focused block goes solid black (primary + its supporting text) */
.ih .stat.idea-active .big, .ih .stat.idea-active .cap{color:var(--fg)!important}
.ih .wire.idea-active b, .ih .wire.idea-active span{color:var(--fg)!important}
.ih .flow .chip.idea-active{color:var(--fg)!important;border-color:var(--fg)!important}
.ih .cell-part.idea-active b, .ih .cell-part.idea-active span{color:var(--fg)!important}
.ih .pan.idea-active b, .ih .pan.idea-active span{color:var(--fg)!important}
.ih .lead.idea-active{color:var(--fg)!important}
.ih .thesis.idea-active b{color:var(--fg)!important}
</style></head><body>

<script>/* deck_anim.js — D3 rhetorical-pattern animation library for talking HTML decks.
 *
 * Each pattern exposes: DeckAnim.<pattern>(svg, data, W, H) -> function draw(p)
 * where p is normalized progress in [0,1] across the slide's audio duration.
 *
 * DETERMINISM RULES (mirrored from the Remotion pattern library so HTML and MP4
 * look alike): all motion is a pure function of p; interpolation is clamped;
 * pseudo-randomness is seeded by index, never Math.random().
 */
(function (global) {
  const D = global.d3;

  // ---- deterministic helpers -------------------------------------------------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  // clamped remap: value x in [x0,x1] -> [y0,y1]
  const remap = (x, x0, x1, y0, y1) => {
    if (x1 === x0) return y0;
    const t = clamp((x - x0) / (x1 - x0), 0, 1);
    return lerp(y0, y1, t);
  };
  // ease (spring-ish settle) — deterministic, no time state
  const easeOutBack = (t) => {
    t = clamp(t, 0, 1);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  // index-seeded pseudo-random in [0,1)
  const seeded = (i) => {
    const x = Math.sin((i + 1) * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  const FONT = "'JetBrains Mono',ui-monospace,monospace";
  const ACCENT = "#ea580c";
  const INK = "#111111";
  const MUTE = "#6b6b6b";
  const WARN = "#b91c1c";
  const GOOD = "#16a34a";

  // ===========================================================================
  // PATTERN 1 — ATTRITION CHAIN
  // A starting population is reduced through named gates. Survivors advance;
  // the lost fraction drifts down and fades. A live counter earns each number.
  // data: { total, startLabel, stages:[{label,survival,claim}], endClaim }
  // ===========================================================================
  function attritionChain(svg, data, W, H) {
    const total = data.total || 1000;
    const stages = data.stages || [];
    const cols = stages.length + 1;
    const padX = 70, padTop = 96, padBot = 150;
    const laneW = (W - padX * 2) / cols;
    const panelW = laneW * 0.78;
    const panelTop = padTop + 10;
    const panelH = H - panelTop - padBot;

    // survivor counts per column
    const counts = [total];
    for (const s of stages) counts.push(Math.round(counts[counts.length - 1] * s.survival));

    const colX = (c) => padX + laneW * c + laneW / 2;

    // grid position of dot #i within a column holding `count` dots
    function gridPos(i, count, c) {
      const n = Math.max(1, count);
      const cc = Math.max(3, Math.ceil(Math.sqrt(n * (panelW / panelH))));
      const rr = Math.max(1, Math.ceil(n / cc));
      const ipx = 16, ipy = 18;
      const uw = panelW - ipx * 2, uh = panelH - ipy * 2;
      const gc = i % cc, gr = Math.floor(i / cc);
      const x = colX(c) - panelW / 2 + ipx + (cc === 1 ? uw / 2 : (gc / (cc - 1)) * uw);
      const y = panelTop + ipy + (rr === 1 ? uh / 2 : (gr / Math.max(1, rr - 1)) * uh);
      return { x, y };
    }
    function lossPos(i, c) {
      const bx = colX(c) + ((seeded(i) - 0.5) * panelW * 0.7);
      return { x: bx, y: panelTop + panelH + 26 + seeded(i * 3) * 70 };
    }

    // static layer: panels, labels, connectors
    const bg = svg.append("g");
    for (let c = 0; c < cols; c++) {
      bg.append("rect")
        .attr("x", colX(c) - panelW / 2).attr("y", panelTop)
        .attr("width", panelW).attr("height", panelH)
        .attr("rx", 6).attr("fill", "none")
        .attr("stroke", INK).attr("stroke-width", c === 0 ? 2.5 : 1.5)
        .attr("stroke-opacity", 0.28);
      const rawLabel = (c === 0 ? (data.startLabel || "start") : stages[c - 1].label).toUpperCase();
      const maxW = laneW * 0.96;
      const fits = (s, fs) => s.length * fs * 0.6 <= maxW;
      let lines, fs = 14;
      if (fits(rawLabel, 14)) { lines = [rawLabel]; }
      else {
        // balance into two lines on a word boundary near the middle
        const words = rawLabel.split(" ");
        let best = rawLabel, bestIdx = -1, bestDiff = 1e9;
        for (let k = 1; k < words.length; k++) {
          const a = words.slice(0, k).join(" "), b = words.slice(k).join(" ");
          const diff = Math.abs(a.length - b.length);
          if (diff < bestDiff) { bestDiff = diff; bestIdx = k; }
        }
        lines = bestIdx > 0 ? [words.slice(0, bestIdx).join(" "), words.slice(bestIdx).join(" ")] : [rawLabel];
        fs = 13;
        while (fs > 9 && !lines.every((l) => fits(l, fs))) fs -= 1;
      }
      const tl = bg.append("text")
        .attr("x", colX(c)).attr("text-anchor", "middle").attr("font-family", FONT)
        .attr("font-size", fs).attr("font-weight", 700).attr("fill", INK)
        .attr("class", "colLabel").attr("data-col", c);
      if (lines.length === 1) tl.attr("y", panelTop - 14).text(lines[0]);
      else lines.forEach((ln, li) => tl.append("tspan").attr("x", colX(c)).attr("y", panelTop - 26 + li * (fs + 2)).text(ln));
    }

    // dots — size from the densest (first) column's grid pitch so points stay distinct
    (function () {
      const n = Math.max(1, counts[0]);
      const cc = Math.max(3, Math.ceil(Math.sqrt(n * (panelW / panelH))));
      const rr = Math.max(1, Math.ceil(n / cc));
      const uw = panelW - 32, uh = panelH - 36;
      const pitch = Math.min(cc > 1 ? uw / (cc - 1) : uw, rr > 1 ? uh / (rr - 1) : uh);
      attritionChain._dotR = clamp(pitch * 0.34, 1.3, 6);
    })();
    const dotR = attritionChain._dotR;
    const dots = svg.append("g").attr("class", "dots");
    const nodes = D.range(total).map((i) => ({ i }));
    const sel = dots.selectAll("circle").data(nodes).join("circle")
      .attr("r", dotR).attr("fill", INK);

    // per-stage timing windows across p∈[0,1]
    const intro = 0.10, outro = 0.06;
    const span = 1 - intro - outro;
    const each = span / Math.max(1, stages.length);
    const ranges = stages.map((_, k) => ({ a: intro + k * each, b: intro + (k + 1) * each }));

    // live counter + labels
    const hud = svg.append("g");
    const counterBox = hud.append("g");
    counterBox.append("rect").attr("x", W / 2 - 150).attr("y", 20).attr("width", 300).attr("height", 58)
      .attr("rx", 6).attr("fill", "#ffffff").attr("stroke", ACCENT).attr("stroke-width", 2);
    const bigNum = counterBox.append("text").attr("x", W / 2).attr("y", 52)
      .attr("text-anchor", "middle").attr("font-family", FONT).attr("font-size", 30)
      .attr("font-weight", 800).attr("fill", INK);
    const pctNum = counterBox.append("text").attr("x", W / 2).attr("y", 72)
      .attr("text-anchor", "middle").attr("font-family", FONT).attr("font-size", 13)
      .attr("font-weight", 700).attr("fill", ACCENT);

    return function draw(p) {
      // survivors "earned" so far -> for counter
      let curCount = counts[0];
      let stageIdx = 0;
      for (let k = 0; k < stages.length; k++) {
        const r = ranges[k];
        if (p >= r.b) { curCount = counts[k + 1]; stageIdx = k + 1; }
        else if (p >= r.a) {
          const t = easeOutCubic((p - r.a) / (r.b - r.a));
          curCount = Math.round(lerp(counts[k], counts[k + 1], t));
          stageIdx = k;
          break;
        } else break;
      }
      bigNum.text(`${curCount} / ${total}`);
      const pct = (curCount / total) * 100;
      pctNum.text(pct >= 1 ? `${pct.toFixed(0)}% remain` : `${pct.toFixed(1)}% remain`);
      pctNum.attr("fill", curCount === counts[counts.length - 1] && p > ranges[ranges.length - 1].b - 0.001 ? ACCENT : ACCENT);

      // column label emphasis
      bg.selectAll(".colLabel").attr("fill", function () {
        return +D.select(this).attr("data-col") <= stageIdx ? INK : MUTE;
      }).attr("fill-opacity", function () {
        return +D.select(this).attr("data-col") <= stageIdx + 1 ? 1 : 0.35;
      });

      sel.each(function (d) {
        const i = d.i;
        let x, y, op = i < counts[0] ? 1 : 0;
        // find the dot's current column and motion
        let placed = false;
        for (let k = 0; k < stages.length; k++) {
          const fromCount = counts[k], toCount = counts[k + 1];
          const r = ranges[k];
          const survives = i < toCount;
          const from = gridPos(i, fromCount, k);
          if (p < r.a) { const q = gridPos(i, fromCount, k); x = q.x; y = q.y; op = i < fromCount ? 1 : 0; placed = true; break; }
          const t = easeOutCubic((p - r.a) / (r.b - r.a));
          if (p < r.b) {
            if (survives) { const to = gridPos(i, toCount, k + 1); x = lerp(from.x, to.x, t); y = lerp(from.y, to.y, t); op = 1; }
            else { const lp = lossPos(i, k); x = lerp(from.x, lp.x, t); y = lerp(from.y, lp.y, t); op = remap(t, 0, 0.85, 1, 0); }
            placed = true; break;
          }
          if (survives) { const set = gridPos(i, toCount, k + 1); x = set.x; y = set.y; op = 1; continue; }
          op = 0; placed = true; break;
        }
        if (!placed && op > 0) { const q = gridPos(i, counts[counts.length - 1], cols - 1); x = q.x; y = q.y; }
        const node = D.select(this);
        node.attr("cx", x).attr("cy", y).attr("opacity", op)
          .attr("fill", (stageIdx >= stages.length && i < counts[counts.length - 1]) ? ACCENT : INK);
      });
    };
  }

  // ===========================================================================
  // PATTERN 2 — SCALE COMPARISON
  // Place magnitudes on a truthful shared (log) axis. Markers travel from a
  // common origin to their true positions; a highlighted band marks the window.
  // data: { axis:{min,max,unit}, band:{from,to,label}, items:[{label,value,value2?,hot?}] }
  // ===========================================================================
  function scaleComparison(svg, data, W, H, resolvedSignals) {
    const ax = data.axis, items = data.items;
    const x0 = 150, x1 = W - 110, yAxis = H - 150;
    const useLog = ax.log !== false && ax.log !== 0 && ax.min > 0;
    const scale = useLog ? (v) => Math.log10(v) : (v) => v;
    const xOf = (v) => remap(scale(v), scale(ax.min), scale(ax.max), x0, x1);
    const u = ax.unit || "nm";
    const trimNum = (v) => (Math.round(v * 100) / 100).toString();
    // unit-aware tick/label formatter: only auto-promote nm→µm→mm; otherwise show in the axis unit
    const fmtV = (v) => {
      if (u === "nm") return v >= 1e6 ? trimNum(v / 1e6) + "mm" : v >= 1000 ? trimNum(v / 1000) + "µm" : trimNum(v) + "nm";
      if (u === "µm") return v >= 1000 ? trimNum(v / 1000) + "mm" : trimNum(v) + "µm";
      return trimNum(v) + " " + u;
    };

    // axis
    const axg = svg.append("g");
    axg.append("line").attr("x1", x0).attr("x2", x1).attr("y1", yAxis).attr("y2", yAxis)
      .attr("stroke", INK).attr("stroke-width", 2).attr("class", "axline")
      .attr("data-anim-id", "sc-axline")
      .attr("stroke-dasharray", (x1 - x0)).attr("stroke-dashoffset", (x1 - x0));
    // ticks: decade ticks for log, ~5 linear ticks otherwise
    const ticks = [];
    if (useLog) {
      for (let e = Math.ceil(Math.log10(ax.min)); e <= Math.floor(Math.log10(ax.max)); e++) ticks.push(Math.pow(10, e));
    } else {
      const span = ax.max - ax.min, step = Math.pow(10, Math.floor(Math.log10(span / 5)));
      const nice = step * Math.ceil(span / (step * 5));
      for (let v = Math.ceil(ax.min / nice) * nice; v <= ax.max; v = Math.round((v + nice) * 1e10) / 1e10) ticks.push(v);
    }
    const tickG = axg.selectAll("g.tick").data(ticks).join("g").attr("class", "tick");
    tickG.append("line").attr("x1", d => xOf(d)).attr("x2", d => xOf(d)).attr("y1", yAxis).attr("y2", yAxis + 8)
      .attr("stroke", MUTE).attr("stroke-width", 1);
    tickG.append("text").attr("x", d => xOf(d)).attr("y", yAxis + 26).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 11).attr("fill", MUTE)
      .text(d => fmtV(d));
    axg.append("text").attr("x", x1).attr("y", yAxis + 46).attr("text-anchor", "end")
      .attr("font-family", FONT).attr("font-size", 11).attr("fill", MUTE).attr("letter-spacing", ".1em")
      .text((data.axisLabel || (useLog ? "size" : u)).toUpperCase() + (useLog ? " (log scale, " + u + ")" : ""));

    // band
    const band = svg.append("g").attr("opacity", 0).attr("class", "band").attr("data-anim-id", "sc-band");
    band.append("rect").attr("y", 96).attr("height", yAxis - 96)
      .attr("fill", ACCENT).attr("opacity", 0.10);
    band.append("text").attr("y", 88).attr("text-anchor", "middle").attr("class", "bandLabel")
      .attr("font-family", FONT).attr("font-size", 13).attr("font-weight", 700).attr("fill", ACCENT);

    // items
    const rows = items.length;
    const yOf = (i) => 130 + (i + 0.5) * ((yAxis - 150) / rows);
    const ig = svg.append("g");
    const nodes = ig.selectAll("g.item").data(items.map((d, i) => ({ ...d, i }))).join("g")
      .attr("class", "item").attr("data-anim-id", d => "sc-item-" + d.i);
    nodes.append("line").attr("class", "stem").attr("stroke", d => d.hot ? ACCENT : INK).attr("stroke-width", d => d.hot ? 2 : 1).attr("stroke-opacity", 0.35);
    const bar = nodes.append("g").attr("class", "bar");
    bar.append("rect").attr("class", "rng").attr("height", d => d.hot ? 14 : 10).attr("rx", 3)
      .attr("fill", d => d.hot ? ACCENT : INK);
    bar.append("circle").attr("class", "pt").attr("r", d => d.hot ? 8 : 6).attr("fill", d => d.hot ? ACCENT : INK);
    nodes.append("text").attr("class", "ilabel").attr("font-family", FONT).attr("font-weight", 700)
      .attr("font-size", d => d.hot ? 16 : 14).attr("fill", d => d.hot ? ACCENT : INK).attr("dy", "0.35em");
    nodes.append("text").attr("class", "ival").attr("font-family", FONT).attr("font-size", 11)
      .attr("fill", MUTE).attr("dy", "0.35em");

    const _sigs = resolvedSignals || {};
    return function draw(p) {
      // axis draws 0-0.18 (or axis_draw signal)
      const axP = _sigs.axis_draw ? _v2.evalSignal(_sigs.axis_draw, p) : remap(p, 0, 0.18, 0, 1);
      axg.select(".axline").attr("stroke-dashoffset", (x1 - x0) * (1 - axP));
      // band 0.18-0.34 (optional, or band_in signal)
      if (data.band) {
        const bandP = _sigs.band_in ? _v2.evalSignal(_sigs.band_in, p) : remap(p, 0.18, 0.34, 0, 1);
        band.attr("opacity", bandP);
        const bx0 = xOf(data.band.from), bx1 = xOf(data.band.to);
        band.select("rect").attr("x", bx0).attr("width", (bx1 - bx0) * easeOutCubic(bandP));
        band.select(".bandLabel").attr("x", (bx0 + bx1) / 2).text(data.band.label.toUpperCase());
      }
      // items staggered within items_go signal phase (or default 0.30-0.92)
      const _itemsPhase = _sigs.items_go ? _v2.evalSignal(_sigs.items_go, p) : null;
      nodes.each(function (d) {
        let iT;
        if (_itemsPhase !== null) {
          const stN = (d.i / rows) * 0.55, enN = stN + 0.35;
          iT = easeOutCubic(remap(_itemsPhase, stN, enN, 0, 1));
        } else {
          const st = 0.30 + (d.i / rows) * 0.5, en = st + 0.28;
          iT = easeOutCubic(remap(p, st, en, 0, 1));
        }
        const g = D.select(this);
        const y = yOf(d.i);
        const tx = xOf(d.value);
        const tx2 = d.value2 ? xOf(d.value2) : tx;
        const curX = lerp(x0, tx, iT);
        const curX2 = lerp(x0, tx2, iT);
        g.select(".stem").attr("x1", curX).attr("x2", curX).attr("y1", y).attr("y2", yAxis).attr("stroke-opacity", 0.30 * iT);
        const rng = g.select(".rng");
        if (d.value2) rng.attr("x", curX).attr("y", y - (d.hot ? 7 : 5)).attr("width", Math.max(6, curX2 - curX));
        else rng.attr("width", 0);
        g.select(".pt").attr("cx", d.value2 ? (curX + curX2) / 2 : curX).attr("cy", y).attr("opacity", d.value2 ? 0 : 1);
        g.select(".ilabel").attr("x", x0 - 14).attr("y", y).attr("text-anchor", "end").attr("opacity", iT)
          .text(d.label.toUpperCase());
        g.select(".ival").attr("x", (d.value2 ? curX2 : curX) + 16).attr("y", y).attr("opacity", iT)
          .text(d.value2 ? `${d.value}–${d.value2} ${ax.unit}` : `${d.value} ${ax.unit}`);
      });
    };
  }

  // ===========================================================================
  // PATTERN 3 — BINARY BRANCH
  // Two competing interpretations fork from one question; a resolving piece of
  // evidence sweeps in and shows which is true. data:
  // { question, branches:[{label,detail,fix,tone}], resolver:{label,detail} }
  // ===========================================================================
  function binaryBranch(svg, data, W, H) {
    const cx = W / 2, qy = 150;
    const leftX = W * 0.26, rightX = W * 0.74, outY = 360;
    const toneCol = (t) => t === "warn" ? WARN : (t === "good" ? GOOD : INK);

    const g = svg.append("g");
    // question node
    const q = g.append("g").attr("class", "qn").attr("opacity", 0);
    q.append("rect").attr("x", cx - 300).attr("y", qy - 34).attr("width", 600).attr("height", 60).attr("rx", 6)
      .attr("fill", "#fff").attr("stroke", INK).attr("stroke-width", 2);
    q.append("text").attr("x", cx).attr("y", qy).attr("text-anchor", "middle").attr("dy", "0.35em")
      .attr("font-family", FONT).attr("font-size", 18).attr("font-weight", 800).attr("fill", INK)
      .text(data.question);

    const branches = data.branches.map((b, i) => ({ ...b, x: i === 0 ? leftX : rightX }));
    // connector paths
    const paths = g.selectAll("path.br").data(branches).join("path").attr("class", "br")
      .attr("fill", "none").attr("stroke", d => toneCol(d.tone)).attr("stroke-width", 2.5);
    // outcome cards
    const cards = g.selectAll("g.oc").data(branches).join("g").attr("class", "oc").attr("opacity", 0);
    cards.append("rect").attr("x", d => d.x - 190).attr("y", outY - 20).attr("width", 380).attr("height", 132).attr("rx", 6)
      .attr("fill", "#fff").attr("stroke", d => toneCol(d.tone)).attr("stroke-width", 2);
    cards.append("text").attr("x", d => d.x).attr("y", outY + 6).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 18).attr("font-weight", 800).attr("fill", d => toneCol(d.tone))
      .text(d => d.label.toUpperCase());
    cards.append("text").attr("x", d => d.x).attr("y", outY + 34).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 13).attr("fill", MUTE).text(d => d.detail);
    cards.append("text").attr("x", d => d.x).attr("y", outY + 78).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 13).attr("font-weight", 700).attr("fill", INK)
      .text(d => "→ " + d.fix);

    // "tumor volume can't tell" ghost between the two
    const ghost = g.append("text").attr("x", cx).attr("y", outY + 40).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 13).attr("fill", MUTE).attr("opacity", 0)
      .attr("class", "ghost").text("tumor response alone cannot tell them apart");

    // resolver beam
    const rb = g.append("g").attr("class", "rb").attr("opacity", 0);
    const rbY = H - 150;
    rb.append("rect").attr("x", cx - 260).attr("y", rbY - 34).attr("width", 520).attr("height", 64).attr("rx", 6)
      .attr("fill", ACCENT);
    rb.append("text").attr("x", cx).attr("y", rbY - 8).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 17).attr("font-weight", 800).attr("fill", "#fff")
      .text(data.resolver.label.toUpperCase());
    rb.append("text").attr("x", cx).attr("y", rbY + 14).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 12).attr("fill", "rgba(255,255,255,.85)")
      .text(data.resolver.detail);
    const beamL = g.append("line").attr("class", "beamL").attr("stroke", ACCENT).attr("stroke-width", 2).attr("stroke-dasharray", "5 5").attr("opacity", 0);
    const beamR = g.append("line").attr("class", "beamR").attr("stroke", ACCENT).attr("stroke-width", 2).attr("stroke-dasharray", "5 5").attr("opacity", 0);

    function pathD(b) {
      const sy = qy + 30, ey = outY - 22;
      const my = (sy + ey) / 2;
      return `M ${cx} ${sy} C ${cx} ${my}, ${b.x} ${my}, ${b.x} ${ey}`;
    }
    paths.attr("d", pathD).each(function () { const l = this.getTotalLength(); D.select(this).attr("stroke-dasharray", l).attr("stroke-dashoffset", l); });

    return function draw(p) {
      g.select(".qn").attr("opacity", remap(p, 0, 0.12, 0, 1));
      const brP = remap(p, 0.14, 0.42, 0, 1);
      paths.each(function () { const l = this.getTotalLength(); D.select(this).attr("stroke-dashoffset", l * (1 - easeOutCubic(brP))); });
      cards.attr("opacity", remap(p, 0.36, 0.52, 0, 1));
      ghost.attr("opacity", remap(p, 0.52, 0.62, 0, 1) * (1 - remap(p, 0.72, 0.82, 0, 1)));
      // resolver sweeps up 0.66-1.0
      const rP = easeOutCubic(remap(p, 0.66, 0.92, 0, 1));
      rb.attr("opacity", remap(p, 0.66, 0.76, 0, 1));
      beamL.attr("x1", cx - 120).attr("y1", rbY - 34).attr("x2", branches[0].x).attr("y2", outY + 112)
        .attr("opacity", rP).attr("stroke-dashoffset", 0);
      beamR.attr("x1", cx + 120).attr("y1", rbY - 34).attr("x2", branches[1].x).attr("y2", outY + 112).attr("opacity", rP);
      // emphasize cards once resolver connects
      cards.select("rect").attr("stroke-width", 2 + 1.5 * rP);
    };
  }

  // ===========================================================================
  // PATTERN 4 — DIVERGENT FATES
  // Two entities start identical, then follow opposite trajectories over time.
  // data: { startLabel, splitLabel, tracks:[{label,outcome,tone,path:'up'|'down',notes:[]}] }
  // ===========================================================================
  function divergentFates(svg, data, W, H) {
    const x0 = 150, xSplit = W * 0.34, x1 = W - 300;
    const yMid = H * 0.46, yUp = H * 0.20, yDn = H * 0.72;
    const tracks = data.tracks;
    const toneCol = (t) => t === "warn" ? WARN : (t === "good" ? GOOD : INK);
    const g = svg.append("g");

    // baseline / split marker
    g.append("line").attr("x1", xSplit).attr("x2", xSplit).attr("y1", 110).attr("y2", H - 120)
      .attr("stroke", MUTE).attr("stroke-width", 1).attr("stroke-dasharray", "4 5").attr("opacity", 0.5);
    const fitTxt = (s, availW, fs) => {
      const cw = fs * 0.68; const max = Math.max(4, Math.floor(availW / cw));
      return s.length <= max ? s : s.slice(0, max - 1).trimEnd() + "…";
    };
    g.append("text").attr("x", x0).attr("y", 96).attr("font-family", FONT).attr("font-size", 13).attr("font-weight", 700)
      .attr("fill", MUTE).attr("letter-spacing", ".08em").text(fitTxt(data.startLabel.toUpperCase(), xSplit - x0 - 20, 13));
    g.append("text").attr("x", xSplit + 12).attr("y", 96).attr("font-family", FONT).attr("font-size", 13).attr("font-weight", 700)
      .attr("fill", ACCENT).attr("letter-spacing", ".08em").text("→ " + fitTxt(data.splitLabel.toUpperCase(), (W - 150) - (xSplit + 12) - 18, 13));

    const yEnd = (t) => t.path === "up" ? yUp : yDn;
    function trackPath(t) {
      const ye = yEnd(t);
      return `M ${x0} ${yMid} L ${xSplit} ${yMid} C ${(xSplit + x1) / 2} ${yMid}, ${(xSplit + x1) / 2} ${ye}, ${x1} ${ye}`;
    }
    const paths = g.selectAll("path.trk").data(tracks).join("path").attr("class", "trk")
      .attr("fill", "none").attr("stroke", d => toneCol(d.tone)).attr("stroke-width", 3)
      .attr("d", trackPath).each(function () { const l = this.getTotalLength(); D.select(this).attr("data-len", l); });

    const markers = g.selectAll("circle.mk").data(tracks).join("circle").attr("class", "mk")
      .attr("r", 9).attr("fill", d => toneCol(d.tone)).attr("stroke", "#fff").attr("stroke-width", 2);

    // endpoint badges
    const badges = g.selectAll("g.bdg").data(tracks).join("g").attr("class", "bdg").attr("opacity", 0);
    badges.append("rect").attr("x", x1 + 8).attr("y", d => yEnd(d) - 26).attr("width", 268).attr("height", 52).attr("rx", 6)
      .attr("fill", "#fff").attr("stroke", d => toneCol(d.tone)).attr("stroke-width", 2);
    badges.append("text").attr("x", x1 + 22).attr("y", d => yEnd(d) - 6).attr("font-family", FONT).attr("font-size", 14)
      .attr("font-weight", 800).attr("fill", d => toneCol(d.tone)).text(d => fitTxt(d.label, 244, 14));
    badges.append("text").attr("x", x1 + 22).attr("y", d => yEnd(d) + 14).attr("font-family", FONT).attr("font-size", 12)
      .attr("fill", MUTE).text(d => fitTxt("→ " + d.outcome, 244, 12));

    // note chips revealed along the path
    const noteG = g.selectAll("g.notes").data(tracks).join("g").attr("class", "notes");

    return function draw(p) {
      // travel 0.15 - 0.9
      paths.each(function (d) {
        const l = +D.select(this).attr("data-len");
        const t = easeOutCubic(remap(p, 0.15, 0.88, 0, 1));
        D.select(this).attr("stroke-dasharray", l).attr("stroke-dashoffset", l * (1 - t));
      });
      markers.each(function (d, i) {
        const path = paths.nodes()[i];
        const l = path.getTotalLength();
        const t = easeOutCubic(remap(p, 0.15, 0.88, 0, 1));
        const pt = path.getPointAtLength(l * t);
        D.select(this).attr("cx", pt.x).attr("cy", pt.y);
      });
      badges.attr("opacity", remap(p, 0.82, 0.94, 0, 1));
      // notes
      noteG.each(function (d) {
        const sel = D.select(this);
        sel.selectAll("text.note").data(d.notes).join(
          enter => enter.append("text").attr("class", "note").attr("font-family", FONT).attr("font-size", 12).attr("fill", MUTE)
        ).attr("x", xSplit + 30).attr("y", (nn, k) => (d.path === "up" ? yUp - 10 : yDn + 26) + k * 18)
          .attr("opacity", (nn, k) => remap(p, 0.4 + k * 0.08, 0.5 + k * 0.08, 0, 1))
          .text(nn => "· " + nn);
      });
    };
  }

  // ===========================================================================
  // PATTERN 5 — THRESHOLD / RESOLVING POWER
  // A state change happens exactly at a visible cutoff. A subject stays blurred
  // until a moving limit line sweeps past its value, then snaps sharp.
  // data: { subject:{label,size,unit}, modes:[{label,sub,limit,resolves}], axisLabel,
  //         axis?:{min,max,unit,log} }  // axis optional; default nm log 0.1–10000
  // ===========================================================================
  function threshold(svg, data, W, H) {
    const sub = data.subject, modes = data.modes;
    const cx = W * 0.62, cy = H * 0.44;
    const axX = 150, axTop = 130, axBot = H - 160;
    const lg = (v) => Math.log10(v);
    const ax = data.axis || { min: 0.1, max: 10000, unit: sub.unit || "nm", log: true };
    const useLog = ax.log !== false && ax.min > 0;
    const aUnit = ax.unit || sub.unit || "";
    const isSize = aUnit === "nm" || aUnit === "µm";
    const fmt = (v) => isSize
      ? (v >= 1000 ? (Math.round(v / 10) / 100) + "µm" : Math.round(v) + "nm")
      : (Math.round(v * 10) / 10).toString();
    const yOf = useLog
      ? (v) => remap(lg(v), lg(ax.max), lg(ax.min), axTop, axBot)
      : (v) => remap(v, ax.max, ax.min, axTop, axBot);

    const g = svg.append("g");
    g.append("line").attr("x1", axX).attr("x2", axX).attr("y1", axTop).attr("y2", axBot).attr("stroke", INK).attr("stroke-width", 2);
    const ticks = [];
    if (useLog) { for (let e = Math.ceil(lg(ax.min)); e <= Math.floor(lg(ax.max)); e++) ticks.push(Math.pow(10, e)); }
    else { const n = 5; for (let k = 0; k <= n; k++) ticks.push(ax.min + (ax.max - ax.min) * k / n); }
    ticks.forEach((v) => {
      g.append("line").attr("x1", axX - 6).attr("x2", axX).attr("y1", yOf(v)).attr("y2", yOf(v)).attr("stroke", MUTE);
      g.append("text").attr("x", axX - 12).attr("y", yOf(v)).attr("text-anchor", "end").attr("dy", "0.35em")
        .attr("font-family", FONT).attr("font-size", 11).attr("fill", MUTE).text(fmt(v));
    });
    g.append("text").attr("x", axX).attr("y", axTop - 14).attr("text-anchor", "middle").attr("font-family", FONT)
      .attr("font-size", 11).attr("fill", MUTE).attr("letter-spacing", ".08em").text((data.axisLabel || "limit").toUpperCase());

    // subject guide line
    g.append("line").attr("x1", axX).attr("x2", W - 90).attr("y1", yOf(sub.size)).attr("y2", yOf(sub.size))
      .attr("stroke", INK).attr("stroke-width", 1).attr("stroke-dasharray", "3 4").attr("opacity", 0.35);
    g.append("text").attr("x", W - 90).attr("y", yOf(sub.size) - 8).attr("text-anchor", "end").attr("font-family", FONT)
      .attr("font-size", 12).attr("fill", INK).attr("font-weight", 700).text(`${sub.label} · ${sub.size} ${sub.unit}`);

    // the subject blob (blurred vs sharp)
    const defs = svg.append("defs");
    const fid = "blur_" + Math.floor(seeded(7) * 1e6);
    const flt = defs.append("filter").attr("id", fid).attr("x", "-60%").attr("y", "-60%").attr("width", "220%").attr("height", "220%");
    const gb = flt.append("feGaussianBlur").attr("in", "SourceGraphic").attr("stdDeviation", 12);
    const blob = g.append("g");
    // a little cluster to make sharpness legible
    const parts = D.range(7).map(i => ({ dx: (seeded(i) - 0.5) * 70, dy: (seeded(i * 5) - 0.5) * 70, r: 8 + seeded(i * 9) * 8 }));
    blob.attr("filter", `url(#${fid})`);
    blob.selectAll("circle").data(parts).join("circle")
      .attr("cx", d => cx + d.dx).attr("cy", d => cy + d.dy).attr("r", d => d.r).attr("fill", ACCENT).attr("opacity", 0.9);

    // moving resolution-limit line + mode label + verdict
    const limitLine = g.append("line").attr("x1", axX).attr("x2", W - 60).attr("stroke", ACCENT).attr("stroke-width", 3);
    const limitTag = g.append("text").attr("font-family", FONT).attr("font-size", 13).attr("font-weight", 800).attr("fill", ACCENT);
    const modeBox = g.append("g");
    modeBox.append("text").attr("class", "mlabel").attr("x", cx).attr("y", H - 118).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 18).attr("font-weight", 800);
    modeBox.append("text").attr("class", "msub").attr("x", cx).attr("y", H - 96).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 12).attr("fill", MUTE);
    const verdict = g.append("text").attr("x", cx).attr("y", cy + 120).attr("text-anchor", "middle")
      .attr("font-family", FONT).attr("font-size", 22).attr("font-weight", 800);

    const lineLabel = data.axisLabel || (isSize ? "resolution limit" : "limit");
    return function draw(p) {
      // mode 1 until 0.5, sweep 0.5-0.7, mode 2 after
      const m1 = modes[0], m2 = modes[1];
      let limitV, mode;
      if (p < 0.5) { limitV = m1.limit; mode = m1; }
      else if (p < 0.7) {
        const sweepT = easeOutCubic(remap(p, 0.5, 0.7, 0, 1));
        limitV = useLog ? Math.pow(10, lerp(lg(m1.limit), lg(m2.limit), sweepT)) : lerp(m1.limit, m2.limit, sweepT);
        mode = sweepT < 0.5 ? m1 : m2;
      } else { limitV = m2.limit; mode = m2; }
      const ly = yOf(limitV);
      limitLine.attr("y1", ly).attr("y2", ly);
      limitTag.attr("x", axX + 14).attr("y", ly - 8).text(`${lineLabel} · ${fmt(limitV)}`);
      // resolves when the limit has crossed to/below the subject value
      const resolved = limitV <= sub.size;
      // smooth blur across the crossing, in the axis metric (log or linear)
      const dAbove = useLog ? (lg(limitV) - lg(sub.size)) : (limitV - sub.size);
      const norm = useLog ? Math.max(lg(m1.limit) - lg(sub.size), 0.3)
                          : Math.max(Math.abs(m1.limit - sub.size), 1e-6);
      const blurAmt = lerp(0.01, 12, clamp(dAbove / norm, 0, 1));
      gb.attr("stdDeviation", blurAmt);
      modeBox.select(".mlabel").attr("fill", resolved ? GOOD : INK).text(mode.label.toUpperCase());
      modeBox.select(".msub").text(mode.sub);
      const vy = (data.verdicts && data.verdicts.yes) || "RESOLVED";
      const vn = (data.verdicts && data.verdicts.no) || "CANNOT RESOLVE";
      verdict.attr("fill", resolved ? GOOD : WARN).attr("opacity", p < 0.35 ? remap(p, 0.2, 0.35, 0, 1) : 1)
        .text(resolved ? vy : vn);
    };
  }

  // ===========================================================================
  // PATTERN 6 — CALLOUT TOUR
  // Progressive disclosure of body blocks: title lands first, then each block
  // fades+slides in one by one across the slide's narration duration.
  // Auto-generated when no anim.json exists and actual_duration_s > 10.
  // data: { title, blocks:["text",...], section }
  // ===========================================================================
  function calloutTour(svg, data, W, H) {
    const blocks  = data.blocks  || [];
    const title   = data.title   || "";
    const section = data.section || "CONTENT";
    const n = blocks.length;

    // background
    svg.append("rect").attr("x",0).attr("y",0).attr("width",W).attr("height",H)
       .attr("fill","hsl(43,23%,93%)");
    // dot grid
    const grid = svg.append("g").attr("opacity",0.05).attr("pointer-events","none");
    for(let gx=13;gx<W;gx+=26) for(let gy=13;gy<H;gy+=26)
      grid.append("circle").attr("cx",gx).attr("cy",gy).attr("r",1).attr("fill",INK);

    // top bar (smeta)
    svg.append("text").attr("x",60).attr("y",62)
       .attr("font-family",FONT).attr("font-size",13).attr("font-weight",600)
       .attr("letter-spacing","0.18em").attr("fill",MUTE)
       .text("// SLIDE — " + section);
    svg.append("line").attr("x1",320).attr("y1",72).attr("x2",W-72).attr("y2",72)
       .attr("stroke",INK).attr("stroke-width",1).attr("opacity",0.16);
    svg.append("rect").attr("x",W-72).attr("y",63).attr("width",9).attr("height",9)
       .attr("fill",ACCENT);

    // title (simple word-wrap: break at 55 chars)
    const titleFz = clamp(Math.round(3.4*W/100), 26, 46);
    const words = title.split(" ");
    let line1 = "", line2 = "";
    for(const w of words){
      if(line1.length + w.length + 1 < 55) line1 += (line1?" ":"")+w;
      else line2 += (line2?" ":"")+w;
    }
    const titleEl = svg.append("text").attr("font-family",FONT).attr("font-size",titleFz)
       .attr("font-weight",800).attr("fill",INK).attr("opacity",0);
    titleEl.append("tspan").attr("x",60).attr("y",100+titleFz).attr("dy",0).text(line1);
    if(line2) titleEl.append("tspan").attr("x",60).attr("dy",titleFz*1.15).attr("fill",ACCENT).text(line2);

    // blocks
    const bodyTop = 100 + titleFz + (line2 ? titleFz*1.2 : 0) + 36;
    const maxH = H - bodyTop - 30;
    const bH = Math.min(62, n > 0 ? Math.floor((maxH - (n-1)*10) / n) : 62);
    const blockEls = blocks.map((txt, k) => {
      const y = bodyTop + k*(bH+10);
      const g = svg.append("g").attr("opacity",0);
      g.append("rect").attr("x",60).attr("y",y).attr("width",W-120).attr("height",bH)
         .attr("fill","hsl(43,20%,90%)").attr("stroke",INK).attr("stroke-width",2);
      g.append("rect").attr("x",60).attr("y",y).attr("width",5).attr("height",bH)
         .attr("fill",ACCENT);
      const fz = clamp(Math.round(1.5*W/100), 13, 18);
      const cap = txt.length > 95 ? txt.slice(0,92)+"…" : txt;
      g.append("text").attr("x",80).attr("y", y + Math.round(bH*0.62))
         .attr("font-family",FONT).attr("font-size",fz).attr("font-weight",700)
         .attr("fill",INK).text(cap);
      return g;
    });

    return function draw(p) {
      // title: 0→0.15
      titleEl.attr("opacity", easeOutCubic(remap(p, 0, 0.15, 0, 1)));
      // blocks: 0.15→0.95 evenly spread
      if(n === 0) return;
      const win = 0.80 / n;
      blockEls.forEach(function(g, k){
        const t0 = 0.15 + k*win, t1 = t0 + win*0.85;
        const a  = easeOutCubic(remap(p, t0, t1, 0, 1));
        g.attr("opacity", a).attr("transform", "translate(0," + (12*(1-a)) + ")");
      });
    };
  }

  // ===========================================================================
  // V2 SUBSTRATE — anchor/signal/op engine
  // Anchors resolve phrases → t ∈ [0,1]; signals map t → p ∈ [0,1];
  // primitives apply p to a D3-selected element; buildOpDraw runs an op list.
  // ===========================================================================
  const _v2 = {
    // Evaluate a resolved signal at normalized audio progress t ∈ [0,1].
    // resolvedSig: {type:'ramp',from_t,to_t} | {type:'pulse',at_t,width_t} | {type:'hold',from_t}
    evalSignal(sig, t) {
      if (sig.type === "ramp")  return remap(t, sig.from_t, sig.to_t, 0, 1);
      if (sig.type === "pulse") return remap(Math.abs(t - sig.at_t), 0, sig.width_t / 2, 1, 0);
      if (sig.type === "hold")  return t >= sig.from_t ? 1 : 0;
      return 0;
    },

    // Primitives: (d3Selection, p ∈ [0,1], cfg) -> void
    primitives: {
      reveal(el, p)        { el.attr("opacity", clamp(p, 0, 1)); },
      position(el, p, cfg) {
        el.attr("x", lerp(cfg.from[0], cfg.to[0], p))
          .attr("y", lerp(cfg.from[1], cfg.to[1], p));
      },
      shape(el, p, cfg) {
        if (cfg.r != null) el.attr("r", lerp(cfg.r[0], cfg.r[1], p));
      },
      scale(el, p, cfg) {
        const s = lerp(cfg.from != null ? cfg.from : 0, cfg.to != null ? cfg.to : 1, p);
        el.attr("transform", `scale(${s})`);
      },
      // Toggle a CSS class (default idea-active) when p >= 0.5
      emphasis(el, p, cfg) {
        const cls = (cfg && cfg.activeClass) || "idea-active";
        const node = el.node ? el.node() : el;
        if (!node) return;
        if (p >= 0.5) node.classList.add(cls); else node.classList.remove(cls);
      }
    },

    // Build a draw(t) that applies resolved ops to a container element
    // resolvedOps: [{selector, signal:{type,...}, primitive, cfg}]
    buildOpDraw(resolvedOps, container) {
      const root = (container && container.node) ? container.node() : container;
      return function opDraw(t) {
        for (const op of resolvedOps) {
          const el = D.select(root).select(op.selector);
          if (el.empty()) continue;
          const p = _v2.evalSignal(op.signal, t);
          _v2.primitives[op.primitive](el, p, op.cfg || {});
        }
      };
    }
  };

  global.DeckAnim = {
    attritionChain, scaleComparison, binaryBranch, divergentFates, threshold,
    calloutTour,
    _v2,
    _util: { clamp, lerp, remap, easeOutBack, easeOutCubic, seeded, FONT, ACCENT, INK, MUTE, WARN, GOOD }
  };
})(window);
</script>

const ANIM = {};
const N = 3;
const slides=[...document.querySelectorAll('.slide')];
const dotsEl=document.getElementById('dots');
const progress=document.getElementById('progress');
const scount=document.getElementById('scount');
const soundBtn=document.getElementById('soundBtn');
let cur=0, soundOn=false, audioEl=null;
const drawers={};
slides.forEach((sec)=>{const id=sec.dataset.id;const cfg=ANIM[id];if(!cfg)return;
  const svg=d3.select(sec).select('svg.asvg');
  if(cfg.v2){
    drawers[id]=DeckAnim[cfg.pattern](svg,cfg.data,1280,720,cfg.resolvedSignals||{});
  }else{
    drawers[id]=DeckAnim[cfg.pattern](svg,cfg.data,1280,720);
  }
  drawers[id](0);});
slides.forEach((_,i)=>{const d=document.createElement('div');d.className='ndot'+(i===0?' active':'');d.onclick=()=>go(i);dotsEl.appendChild(d);});
let animRAF=null, animStart=null;
function stopAnim(){if(animRAF){cancelAnimationFrame(animRAF);animRAF=null;}animStart=null;}
function runAnim(i){stopAnim();const sec=slides[i];const id=sec.dataset.id;
  const cfg=ANIM[id];const ihcfg=(typeof IDEAHL!=='undefined')&&IDEAHL[id];
  if((!cfg&&!ihcfg)||!drawers[id])return;
  const dur=(cfg||ihcfg).dur;
  function tick(ts){let p;
    if(soundOn&&audioEl&&!audioEl.paused){p=audioEl.currentTime/dur;}
    else{if(animStart==null)animStart=ts;p=(ts-animStart)/1000/dur;}
    p=Math.max(0,Math.min(1,p));drawers[id](p);
    if(p<1)animRAF=requestAnimationFrame(tick);}
  animRAF=requestAnimationFrame(tick);}
function stop(){if(audioEl){audioEl.pause();audioEl=null;}}
function play(i){stop();if(!soundOn)return;const src=AUDIO[slides[i].dataset.id];if(!src)return;const a=new Audio(src);audioEl=a;a.play().catch(()=>{});}
function go(i){if(i<0||i>=N)return;slides[cur].classList.remove('active');dotsEl.children[cur].classList.remove('active');cur=i;slides[cur].classList.add('active');dotsEl.children[cur].classList.add('active');progress.style.width=((i+1)/N*100)+'%';scount.textContent=String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');location.hash=String(i+1);play(i);runAnim(i);}
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'\ud83d\udd0a':'\ud83d\udd07';if(soundOn){play(cur);}else stop();animStart=null;};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}if(e.key==='ArrowLeft')go(cur-1);if(e.key==='m')soundBtn.click();if(e.key==='r'){animStart=null;runAnim(cur);}});
window.__deckAnim={drawers,seek:(id,p)=>{stopAnim();if(drawers[id])drawers[id](p);}};
const IDEAHL = {"S01": {"starts": [0.0], "dur": 15.85}, "S02": {"starts": [0.0], "dur": 5.89}};
/* idea_highlight.js — runtime for IDEA-KARAOKE. Concatenate into build_deck_anim.py's
   JS template AFTER the existing SVG-pattern drawer setup (i.e. after `drawers` and
   `window.__deckAnim` exist). Requires the template to inject:  const IDEAHL = {...};
   IDEAHL shape (built in build_deck_anim.py):
     { "S02": { "starts": [0.0, 0.34, 0.39, 0.58], "dur": 30.98 }, ... }
   `starts` = one normalized [0,1) activation point per idea-block, DOM order,
   monotonic non-decreasing. From align.json when present, else even 1/n spacing.

   Idea drawers are registered into the SAME `drawers` map the SVG patterns use, so the
   existing play()/runAnim()/seek() clock (audio.currentTime / dur, wall-clock fallback)
   drives them for free and the deck ↔ MP4 stay in sync. */
(function(){
  const IDEA_SEL = '.stat, .wire, .cell-part, .pan, .chip, .lead, .thesis, .callout';
  const CONTAINER = '.stat-row,.flow,.stack,.grid2,.grid3,.balance';
  function blocksOf(sec){
    return [...sec.querySelector('.cbody, .close, section').querySelectorAll(IDEA_SEL)]
      .filter(el=>!el.matches(CONTAINER));
  }
  window.__IDEA_BLOCKS = {};
  Object.keys(IDEAHL).forEach(id=>{
    const sec = [...document.querySelectorAll('.slide')].find(s=>s.dataset.id===id);
    if(!sec) return;
    sec.classList.add('ih');
    const els = blocksOf(sec);
    els.forEach(el=>el.classList.add('idea'));
    window.__IDEA_BLOCKS[id] = els;
    const starts = IDEAHL[id].starts;
    // pure function of progress p: activate the last block whose start <= p
    drawers[id] = function(p){
      let a = 0; for(let i=0;i<starts.length;i++){ if(p>=starts[i]) a=i; }
      els.forEach((el,i)=>el.classList.toggle('idea-active', i===a));
    };
    drawers[id](0);
  });
  // expose the breakpoints so render_deck_video.py can piecewise-render idea slides
  window.__deckAnim.ideaStarts = (id)=> (IDEAHL[id] ? IDEAHL[id].starts : null);
})();

function initHash(){const h=parseInt(location.hash.replace('#',''));if(h>=1&&h<=N){go(h-1);}else{go(0);}}
window.addEventListener('hashchange',()=>{const h=parseInt(location.hash.replace('#',''));if(h>=1&&h<=N&&h-1!==cur)go(h-1);});
initHash();
</script>
